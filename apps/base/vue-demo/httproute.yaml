# /vue-demo/** 转发到 vue-demo 服务并去掉路径前缀；/vue-demo 补上末尾的 /，页面的相对路径资源才能正确加载
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vue-demo
spec:
  parentRefs:
    - name: edge-gateway
      namespace: istio-ingress
  rules:
    - matches:
        - path:
            type: Exact
            value: /vue-demo
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /vue-demo/
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /vue-demo/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: vue-demo
          port: 80
