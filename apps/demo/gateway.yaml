apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: demo-gateway
  namespace: demo
spec:
  selector:
    istio: ingressgateway       # 对应 CICD-GitOps.md 6.3 安装的网关
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"                   # 有域名后改为实际域名
