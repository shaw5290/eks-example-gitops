apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-stable
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
      track: stable
  template:
    metadata:
      labels:
        app: nginx          # Service 按 app 选中稳定版和灰度版全部 Pod
        track: stable       # DestinationRule 按 track 区分子集
    spec:
      containers:
        - name: nginx
          image: stable-image   # 占位名，由 kustomization.yaml 的 images 替换为 ECR 地址和 Tag
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
