# 灰度权重：两个 weight 之和必须为 100，修改后提交 Git，Flux 自动应用
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: nginx
spec:
  hosts:
    - "*"
  gateways:
    - demo-gateway
  http:
    - route:
        - destination:
            host: nginx
            subset: stable
            port:
              number: 80
          weight: 90
          headers:
            response:
              set:
                x-track: stable     # 响应头标记命中的版本，方便验证分流比例
        - destination:
            host: nginx
            subset: canary
            port:
              number: 80
          weight: 10
          headers:
            response:
              set:
                x-track: canary
